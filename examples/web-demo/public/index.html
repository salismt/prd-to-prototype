<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>web-demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1a1a1a; }
    nav { display: flex; gap: 1rem; padding: 0.75rem 1.5rem; background: #0f2a3f; }
    nav a { color: #fff; text-decoration: none; }
    main { max-width: 32rem; padding: 1.5rem; }
    label { display: block; margin: 1rem 0 0.25rem; }
    input { width: 100%; padding: 0.5rem; font: inherit; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; font: inherit; }
    [role=alert] { color: #a40000; }
    [role=status] { color: #0a6b2d; }
    .note { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav><a href="#/">Home</a><a href="#/profile">Profile</a></nav>
  <main id="view"></main>
  <script src="/app.js"></script>
</body>
</html>
